name: 云端每日更新

on:
  schedule:
    - cron: '0 9 * * *'  # 北京时间 17:00 (UTC 09:00)
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 尝试获取今日比分
        run: python scripts/update_scores.py
        continue-on-error: true

      - name: 重新生成 HTML
        run: python scripts/generate_html.py

      - name: 同步到根目录
        run: |
          cp world_cup/*.html .
          echo "✅ HTML 文件同步完成"

      - name: 提交更新
        run: |
          git config user.name "World Cup Bot"
          git config user.email "bot@worldcup-2026.github"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "每日更新 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ 更新已推送"
          fi
