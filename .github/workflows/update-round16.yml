name: Update Round of 16 (13:00 北京)

on:
  schedule:
    # UTC 5:00 = 北京时间 13:00
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check date
        run: |
          # 只在 6/29 - 7/4 期间执行（淘汰赛 1/16 阶段）
          DAY=$(date +%m%d)
          if [[ "$DAY" < "0629" ]] || [[ "$DAY" > "0704" ]]; then
            echo "不在 1/16 阶段，跳过执行 (日期: $DAY)"
            exit 78  # exit 78 表示跳过的标准退出码
          fi
          echo "在 1/16 阶段日期范围内，继续执行"

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search for Today's Results
        run: |
          echo "=== 搜索今日世界杯比赛结果 ==="
          # 这里可以调用搜索 API
          echo "注意: GitHub Actions 无法直接访问国内搜索 API"
          echo "需要手动更新或使用其他方案"

      - name: Update matches.json
        run: |
          echo "=== 更新数据 ==="
          echo "提示: 请在本地更新 data/matches.json 后推送"
          echo "或者使用 WebSearch 获取结果后手动编辑"

      - name: Generate HTML
        run: |
          pip install jinja2
          python scripts/generate_html.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "自动更新赛程 $(date +%Y-%m-%d)"
          git push