<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6月12日 揭幕战 - 2026年美加墨世界杯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(90deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
            border-radius: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffd700;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255,215,0,0.1);
            border-radius: 8px;
        }
        .back-link:hover { background: rgba(255,215,0,0.2); }
        
        .date-info {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        .date-info .day { font-size: 1.5em; font-weight: bold; color: #ffd700; }
        .date-info .week { color: #888; margin-top: 5px; }
        
        .matches-section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; }
        .section-title {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,215,0,0.3);
        }
        
        .match-item {
            padding: 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #ffd700;
        }
        .match-item:last-child { margin-bottom: 0; }
        .match-item.highlight {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,140,0,0.15));
            border-left: 4px solid #ff8c00;
        }
        .match-time { color: #ffd700; font-weight: bold; margin-bottom: 12px; }
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .match-vs { color: #888; font-size: 0.85em; }
        .match-group {
            display: inline-block;
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-right: 10px;
        }
        .match-venue { color: #666; font-size: 0.9em; }
        .match-tag {
            display: inline-block;
            background: #ff8c00;
            color: #1a1a2e;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <div class="header">
            <h1>🏆 揭幕战</h1>
        </div>
        
        <div class="date-info">
            <div class="day">6月12日 周五</div>
            <div class="week">世界杯开幕日</div>
        </div>
        
        <div class="matches-section">
            <div class="section-title">📋 今日赛程 (2场)</div>
            
            <div class="match-item highlight">
                <div class="match-time">03:00 ✅ 已结束</div>
                <div class="match-teams">
                    <span>🇲🇽 墨西哥</span>
                    <span class="match-score">2-0</span>
                    <span>南非 🇿🇦</span>
                </div>
                <div>
                    <span class="match-group">A组</span>
                    <span class="match-venue">📍 墨西哥城体育场</span>
                </div>
                <div style="margin-top:10px;"><span class="match-tag">🔥 揭幕战</span></div>
                <div style="margin-top:8px;color:#888;font-size:0.85em;">进球：基尼奥尔斯(9')、希门尼斯(67') | 红牌：南非3张</div>
            </div>
            
            <div class="match-item">
                <div class="match-time">10:00</div>
                <div class="match-teams">
                    <span>🇰🇷 韩国</span>
                    <span class="match-vs">vs</span>
                    <span>捷克 🇨🇿</span>
                </div>
                <div>
                    <span class="match-group">A组</span>
                    <span class="match-venue">📍 萨波潘</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
